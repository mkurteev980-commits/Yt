<!doctype html>
<html><head><meta charset="utf-8"><title>Стиль: блочный городок</title>
<style>html,body{margin:0;background:#111}canvas#sheet{display:block;width:100vw;max-width:1080px}</style>
<script type="importmap">{ "imports": { "three": "../grandpa/three.module.js" } }</script>
</head><body>
<canvas id="sheet" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "../grandpa/addons/RoundedBoxGeometry.js";

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:true});renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();const ENV=new THREE.Group();scene.add(ENV);const CHARS=[];

// ---------- textures ----------
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function tex(w,h,draw,rep=[1,1]){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);t.anisotropy=8;return t;}
function noise(g,w,h,a,n=4000,seed=0){for(let i=0;i<n;i++){g.fillStyle=`rgba(${rnd(i+seed)>0.5?255:0},${rnd(i+seed)>0.5?255:0},${rnd(i+seed)>0.5?255:0},${a*rnd(i*3+seed)})`;g.fillRect(rnd(i*7+seed)*w,rnd(i*13+seed)*h,2,2);}}
const plaid=(base,a,b)=>tex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
  for(const [c,o,s] of [[a,0,64],[b,40,64]]){g.fillStyle=c;g.globalAlpha=0.55;for(let x=o;x<w;x+=s){g.fillRect(x,0,18,h);g.fillRect(0,x,w,18);}}
  g.globalAlpha=0.35;g.fillStyle='#fff';for(let x=28;x<w;x+=64){g.fillRect(x,0,3,h);g.fillRect(0,x,w,3);}g.globalAlpha=1;noise(g,w,h,0.08,3000);});
const knit=(base,c1,c2)=>tex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
  const zig=(y,c,amp)=>{g.strokeStyle=c;g.lineWidth=7;g.beginPath();for(let x=0;x<=w;x+=16)g.lineTo(x,y+((x/16)%2?amp:-amp));g.stroke();};
  g.fillStyle=c1;g.fillRect(0,70,w,40);g.fillRect(0,180,w,14);zig(90,c2,10);zig(40,c1,6);zig(150,c2,6);zig(220,c1,6);
  for(let x=8;x<w;x+=32){g.fillStyle=c2;g.beginPath();g.moveTo(x,124);g.lineTo(x+8,134);g.lineTo(x,144);g.lineTo(x-8,134);g.fill();}
  g.globalAlpha=0.12;g.strokeStyle='#000';g.lineWidth=1;for(let y=0;y<h;y+=6)for(let x=0;x<w;x+=6){g.beginPath();g.moveTo(x,y);g.lineTo(x+3,y+4);g.lineTo(x+6,y);g.stroke();}g.globalAlpha=1;});
const jeans=(c='#3F5F8F')=>tex(128,256,(g,w,h)=>{g.fillStyle=c;g.fillRect(0,0,w,h);noise(g,w,h,0.12,5000,5);
  g.strokeStyle='rgba(230,180,90,0.7)';g.setLineDash([5,4]);g.lineWidth=2;g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.moveTo(8,0);g.lineTo(8,h);g.moveTo(w-8,0);g.lineTo(w-8,h);g.stroke();
  g.setLineDash([]);g.fillStyle='rgba(255,255,255,0.12)';g.fillRect(20,90,40,60);});
const stars=tex(256,256,(g,w,h)=>{g.fillStyle='#24308F';g.fillRect(0,0,w,h);
  for(let i=0;i<14;i++){const x=rnd(i)*w,y=rnd(i+9)*h,r=12+rnd(i+3)*12;g.fillStyle=i%3?'#FFD43B':'#7FD3FF';g.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,rr=k%2?r*0.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.fill();}});
const brick=(c='#A4493A')=>tex(256,256,(g,w,h)=>{g.fillStyle='#D8CFC2';g.fillRect(0,0,w,h);
  for(let r=0;r<16;r++)for(let k=-1;k<5;k++){const x=k*64+(r%2?32:0),y=r*16;const v=rnd(r*11+k)*30-15;
    g.fillStyle=`hsl(${8+v*0.2},45%,${38+v*0.4}%)`;g.fillRect(x+2,y+2,60,12);} noise(g,w,h,0.1,3000,2);},[3,3]);
const siding=(c)=>tex(128,128,(g,w,h)=>{g.fillStyle=c;g.fillRect(0,0,w,h);for(let y=0;y<h;y+=16){g.fillStyle='rgba(0,0,0,0.12)';g.fillRect(0,y+13,w,3);g.fillStyle='rgba(255,255,255,0.15)';g.fillRect(0,y,w,2);}},[2,4]);
const grass=tex(256,256,(g,w,h)=>{g.fillStyle='#5DA03A';g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){g.fillStyle=`hsl(${95+rnd(i)*25},${45+rnd(i+1)*20}%,${30+rnd(i+2)*22}%)`;g.fillRect(rnd(i+3)*w,rnd(i+4)*h,2,4);}},[40,40]);
const asphalt=tex(256,256,(g,w,h)=>{g.fillStyle='#4A4D55';g.fillRect(0,0,w,h);noise(g,w,h,0.18,9000,9);},[20,3]);
const tiles=tex(128,128,(g,w,h)=>{g.fillStyle='#C9C6C0';g.fillRect(0,0,w,h);g.strokeStyle='#A9A59E';g.lineWidth=3;g.strokeRect(0,0,w,h);noise(g,w,h,0.08,1500,4);},[30,2]);
const wood=tex(256,256,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=`hsl(28,${45+rnd(i)*10}%,${40+rnd(i+5)*10}%)`;g.fillRect(0,i*32,w,32);g.fillStyle='rgba(0,0,0,0.25)';g.fillRect(0,i*32+30,w,2);g.fillRect(rnd(i+2)*w,i*32,2,32);}
  g.globalAlpha=0.15;g.strokeStyle='#3a2210';for(let i=0;i<60;i++){g.beginPath();const y=rnd(i)*h;g.moveTo(0,y);g.bezierCurveTo(w*0.3,y+4,w*0.6,y-4,w,y+2);g.stroke();}g.globalAlpha=1;},[3,3]);
const rug=tex(256,256,(g,w,h)=>{g.fillStyle='#C8483E';g.fillRect(0,0,w,h);g.strokeStyle='#F0C27A';g.lineWidth=8;g.strokeRect(14,14,w-28,h-28);g.strokeStyle='#7A1F1A';g.lineWidth=5;g.strokeRect(30,30,w-60,h-60);
  g.fillStyle='#F0C27A';g.beginPath();g.moveTo(w/2,60);g.lineTo(w-70,h/2);g.lineTo(w/2,h-60);g.lineTo(70,h/2);g.closePath();g.fill();g.fillStyle='#7A1F1A';g.beginPath();g.arc(w/2,h/2,26,0,7);g.fill();noise(g,w,h,0.1,4000,7);});
const painting=(sky,hill)=>tex(128,96,(g,w,h)=>{g.fillStyle=sky;g.fillRect(0,0,w,h);g.fillStyle='#fff8';g.beginPath();g.arc(30,22,10,0,7);g.fill();g.fillStyle=hill;g.beginPath();g.moveTo(0,h);g.lineTo(0,60);g.quadraticCurveTo(40,30,80,62);g.quadraticCurveTo(105,48,w,58);g.lineTo(w,h);g.fill();g.fillStyle='#2E5E2E';g.fillRect(0,80,w,16);});

const M=(o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:0.85,metalness:0},o));
function box(w,h,d,mat,x=0,y=0,z=0,parent=ENV,r=0){const geo=r?new RoundedBoxGeometry(w,h,d,3,r):new THREE.BoxGeometry(w,h,d);const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m;}

// ---------- faces ----------
function faceTex(f){return tex(256,256,(g,w,h)=>{
  // простые «экспрессивные» лица: маленькие чёрные глаза, густые брови, рот с зубами
  g.clearRect(0,0,w,h);g.lineCap='round';g.lineJoin='round';
  const ink='#141210';const ey=118,ex=40;const lx=(f.look||0)*6;
  for(const s of [-1,1]){
    const big=f.mouth==='scream'||f.brow==='scared';
    if(big){g.fillStyle='#fff';g.strokeStyle=ink;g.lineWidth=4;g.beginPath();g.ellipse(128+s*ex,ey,15,19,0,0,7);g.fill();g.stroke();
      g.fillStyle=ink;g.beginPath();g.arc(128+s*ex+lx,ey+2,6,0,7);g.fill();}
    else{g.fillStyle=ink;g.beginPath();g.ellipse(128+s*ex+lx,ey,f.squint?13:11,f.squint?8:17,0,0,7);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(128+s*ex+lx-3,ey-5,3,0,7);g.fill();}
    let inY=ey-28,outY=ey-30;
    if(f.brow==='angry'){inY=ey-14;outY=ey-36;} if(f.brow==='scared'){inY=ey-42;outY=ey-26;} if(f.brow==='sly'){if(s<0){inY=ey-20;outY=ey-24;}else{inY=ey-40;outY=ey-34;}}
    g.strokeStyle=f.browC||ink;g.lineWidth=f.thick?13:9;g.beginPath();g.moveTo(128+s*14,inY);g.quadraticCurveTo(128+s*38,Math.min(inY,outY)-6,128+s*62,outY);g.stroke();
    if(f.brow==='angry'){g.lineWidth=3;g.beginPath();g.moveTo(128-6,ey-34);g.lineTo(128-2,ey-22);g.moveTo(128+6,ey-34);g.lineTo(128+2,ey-22);g.stroke();}
  }
  if(f.blush){g.fillStyle='rgba(235,120,110,0.28)';g.beginPath();g.ellipse(70,158,16,9,0,0,7);g.ellipse(186,158,16,9,0,0,7);g.fill();}
  if(f.sweat){g.fillStyle='#8FD3FF';g.strokeStyle=ink;g.lineWidth=3;g.beginPath();g.moveTo(200,70);g.quadraticCurveTo(214,96,200,104);g.quadraticCurveTo(186,96,200,70);g.fill();g.stroke();}
  const my=176;g.strokeStyle=ink;g.lineWidth=6;
  const teethMouth=(top,bot,wd)=>{g.fillStyle='#3A1010';g.beginPath();g.moveTo(128-wd,my+top);g.quadraticCurveTo(128,my+top-6,128+wd,my+top);g.quadraticCurveTo(128+wd*0.8,my+bot,128,my+bot);g.quadraticCurveTo(128-wd*0.8,my+bot,128-wd,my+top);g.closePath();g.fill();
    g.save();g.clip();g.fillStyle='#fff';g.fillRect(128-wd,my+top-8,wd*2,13);g.fillRect(128-wd,my+bot-9,wd*2,9);g.strokeStyle='#bbb';g.lineWidth=2;for(let x=128-wd+12;x<128+wd;x+=12){g.beginPath();g.moveTo(x,my+top-8);g.lineTo(x,my+top+5);g.moveTo(x,my+bot-9);g.lineTo(x,my+bot);g.stroke();}g.restore();
    g.strokeStyle=ink;g.lineWidth=4;g.stroke();};
  if(f.mouth==='grin'){teethMouth(-6,16,42);}
  else if(f.mouth==='evil'){g.fillStyle='#fff';g.beginPath();g.moveTo(80,my-8);g.quadraticCurveTo(128,my+30,180,my-14);g.quadraticCurveTo(128,my+6,80,my-8);g.fill();g.stroke();
    g.lineWidth=2;for(let x=92;x<176;x+=12){g.beginPath();g.moveTo(x,my-6+(x-80)*0.0);g.lineTo(x,my+10);g.stroke();}}
  else if(f.mouth==='smirk'){g.beginPath();g.moveTo(100,my+2);g.quadraticCurveTo(138,my+12,166,my-14);g.stroke();}
  else if(f.mouth==='angry'){teethMouth(4,22,30);}
  else if(f.mouth==='scream'){g.fillStyle='#3A1010';g.beginPath();g.ellipse(128,my+8,22,30,0,0,7);g.fill();g.stroke();g.fillStyle='#fff';g.fillRect(112,my-20,32,8);}
  else if(f.mouth==='scared'){g.fillStyle='#3A1010';g.beginPath();g.ellipse(128,my,13,17,0,0,7);g.fill();g.stroke();}
  else{g.beginPath();g.arc(128,my-24,30,0.28*Math.PI,0.72*Math.PI);g.stroke();}
  if(f.mustache){g.fillStyle='#DADADA';g.strokeStyle='#8A8A8A';g.lineWidth=3;for(const s of [-1,1]){g.beginPath();g.ellipse(128+s*24,my-22,28,11,s*0.25,0,7);g.fill();g.stroke();}}
});}

// ---------- puppets ----------
function person(o){
  const P=new THREE.Group();scene.add(P);CHARS.push(P);
  const skin=M({color:o.skin});
  const shirt=o.shirtTex?M({map:o.shirtTex}):M({color:o.shirt});
  const pants=o.pantsTex?M({map:o.pantsTex}):M({color:o.pants});
  for(const s of [-1,1]){box(0.96,2,1,pants,s*0.5,1,0,P,0.08);box(1.0,0.32,1.12,M({color:o.shoes||'#2A2A2A'}),s*0.5,0.16,0.06,P,0.1);}
  box(2,2,1,shirt,0,3,0,P,0.1);
  if(o.belt)box(2.04,0.22,1.04,M({color:'#5A3A1E'}),0,2.1,0,P,0.05);
  P.arms=[];
  for(const s of [-1,1]){const A=new THREE.Group();A.position.set(s*1.5,3.9,0);P.add(A);
    const sleeve=o.tank?skin:(o.sleeve?M({color:o.sleeve}):shirt);box(1,1.45,1,sleeve,0,-0.72,0,A,0.1);box(0.96,0.6,0.96,skin,0,-1.72,0,A,0.12);
    const pose=s<0?o.la:o.ra;if(pose){A.rotation.x=pose[0];A.rotation.z=pose[1]*s;}P.arms.push(A);}
  const Hd=new THREE.Group();Hd.position.set(0,4.66,0);P.add(Hd);
  Hd.scale.setScalar(0.95);Hd.position.y=4.62;
  box(1.3,1.3,1.3,skin,0,0,0,Hd,0.3);
  const fp=new THREE.Mesh(new THREE.PlaneGeometry(1.15,1.15),new THREE.MeshStandardMaterial({map:faceTex(o.face),transparent:true,roughness:0.9,polygonOffset:true,polygonOffsetFactor:-2}));fp.position.set(0,-0.02,0.655);Hd.add(fp);
  const hairTex=tex(64,128,(g,w,h)=>{g.fillStyle=o.hairC||'#222';g.fillRect(0,0,w,h);for(let i=0;i<70;i++){g.fillStyle=`rgba(${rnd(i)>0.5?255:0},${rnd(i)>0.5?255:0},${rnd(i)>0.5?255:0},${0.05*rnd(i+1)})`;g.fillRect(rnd(i+2)*w,0,1+rnd(i+3)*2,h);}});
  const hc=new THREE.MeshStandardMaterial({map:hairTex,roughness:0.55,metalness:0.05});
  // прядь: скруглённый брусок с поворотом
  const lock=(w,h,d,x,y,z,rx=0,ry=0,rz=0)=>{const m=box(w,h,d,hc,x,y,z,Hd,Math.min(w,h,d)*0.45);m.rotation.set(rx,ry,rz);return m;};
  if(o.hair==='spiky'){lock(1.44,0.5,1.36,0,0.6,-0.03);
    for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2+0.3;lock(0.5,0.62,0.3,Math.sin(a)*0.55,0.85,Math.cos(a)*0.52-0.05,Math.cos(a)*1.0,0,-Math.sin(a)*1.0);}
    for(let i=0;i<3;i++)lock(0.45,0.6,0.3,-0.25+i*0.25,1.0,-0.1+i*0.08,(i-1)*0.5,0,(i-1)*0.5);
    for(let i=0;i<4;i++)lock(0.42,0.62,0.24,-0.5+i*0.33,0.4,0.66,0.3,0,-0.35+i*0.1);
    for(const s of [-1,1])lock(0.24,0.7,0.5,s*0.72,0.15,0.1,0,0,s*0.15);}
  if(o.hair==='emo'){lock(1.46,0.55,1.38,0,0.58,-0.03);
    for(let i=0;i<4;i++)lock(0.42,0.95,0.24,-0.42+i*0.28,0.25-i*0.05,0.66,0.12,0,-0.5+i*0.08);
    for(const s of [-1,1])lock(0.3,0.95,1.1,s*0.7,0.1,-0.05,0,0,s*0.08);
    for(let i=0;i<5;i++)lock(0.32,0.8,0.3,-0.5+i*0.25,0.55,-0.62,-0.7,0,(i-2)*0.2);}
  if(o.hair==='long'){lock(1.48,0.55,1.4,0,0.58,-0.03);
    for(let i=0;i<5;i++)lock(0.34,2.1,0.42,-0.6+i*0.3,-0.55,-0.58+Math.abs(i-2)*0.05,-0.08,0,(i-2)*0.05);
    for(const s of [-1,1]){lock(0.3,1.8,0.5,s*0.74,-0.4,0.12,0,0,s*0.06);lock(0.3,1.6,0.45,s*0.74,-0.45,-0.3,0,0,s*0.08);}
    for(let i=0;i<4;i++)lock(0.4,0.5,0.24,-0.45+i*0.3,0.42,0.66,0.2,0,0.25-i*0.05);}
  if(o.hair==='pigtails'){lock(1.48,0.55,1.4,0,0.58,-0.03);for(let i=0;i<4;i++)lock(0.4,0.5,0.24,-0.45+i*0.3,0.42,0.66,0.2,0,0.25-i*0.05);
    for(const s of [-1,1]){lock(0.3,0.9,0.9,s*0.72,0.1,-0.05);lock(0.5,0.9,0.5,s*0.9,0.55,-0.3,0,0,s*0.9);}}
  if(o.hair==='bald'){for(const s of [-1,1])box(0.22,0.55,0.9,hc,s*0.68,0.05,-0.1,Hd,0.1);box(1.2,0.3,0.25,hc,0,0.0,-0.62,Hd,0.1);}
  if(o.glasses){const gm=M({color:'#222'});for(const s of [-1,1]){const r=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.035,8,20),gm);r.position.set(s*0.27,0.08,0.63);Hd.add(r);}box(0.18,0.04,0.04,gm,0,0.1,0.63,Hd);}
  Hd.rotation.y=o.headY||0;Hd.rotation.z=o.headZ||0;
  P.position.set(o.x,0,o.z||0);P.rotation.y=o.ry||0;return P;
}

// ---------- world ----------
function house(x,z,w,d,h,wall,roofC,trim='#F4F1EA'){
  const G=new THREE.Group();G.position.set(x,0,z);ENV.add(G);
  box(w,h,d,wall,0,h/2,0,G);
  const sh=new THREE.Shape();sh.moveTo(-w/2-0.6,0);sh.lineTo(w/2+0.6,0);sh.lineTo(0,h*0.6);sh.closePath();
  const rg=new THREE.ExtrudeGeometry(sh,{depth:d+1.2,bevelEnabled:false});const roof=new THREE.Mesh(rg,M({color:roofC,roughness:0.7}));roof.position.set(0,h,-d/2-0.6);roof.castShadow=roof.receiveShadow=true;G.add(roof);
  const tm=M({color:trim}),gl=M({color:'#8EC5E8',roughness:0.15,metalness:0.2,emissive:'#223344',emissiveIntensity:0.2});
  const win=(wx,wy)=>{box(1.9,2.1,0.2,tm,wx,wy,d/2+0.05,G);box(1.5,1.7,0.22,gl,wx,wy,d/2+0.07,G);box(0.12,1.7,0.25,tm,wx,wy,d/2+0.1,G);box(1.5,0.12,0.25,tm,wx,wy,d/2+0.1,G);box(2.2,0.18,0.5,tm,wx,wy-1.1,d/2+0.2,G);};
  win(-w/4-0.4,h*0.68);win(w/4+0.4,h*0.68);win(-w/4-0.4,h*0.28);
  box(1.7,3.0,0.2,tm,w/4+0.4,1.5,d/2+0.05,G);box(1.3,2.7,0.24,M({color:'#2F4F6F'}),w/4+0.4,1.4,d/2+0.08,G);
  const k=new THREE.Mesh(new THREE.SphereGeometry(0.08),M({color:'#E0B040',metalness:0.8,roughness:0.3}));k.position.set(w/4+0.85,1.4,d/2+0.25);G.add(k);
  box(1.2,2.8,1.2,brickM,w/3,h+h*0.45,-d/6,G);
  return G;
}
function tree(x,z,s=1){const G=new THREE.Group();G.position.set(x,0,z);G.scale.setScalar(s);ENV.add(G);
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.5,3.5,8),M({color:'#6B4A2E'}));tr.position.y=1.75;tr.castShadow=true;G.add(tr);
  const cols=['#3E8E3A','#4FA444','#357A32'];

function ghost(on){CHARS.forEach(P=>P.traverse(m=>{if(m.isMesh){m.material.colorWrite=!on;m.material.depthWrite=!on;}}));}
function shot(w,h,pos,look,fov,dx,dy,interior=false,blur=0){

  const cam=new THREE.PerspectiveCamera(fov,w/h,0.1,600);cam.position.set(...pos);cam.lookAt(...look);

  if(interior){sun.position.set(RX-18,30,22);sun.target.position.set(RX,0,0);}else{sun.position.set(-18,30,22);sun.target.position.set(0,0,0);}
  sun.target.updateMatrixWorld();
  if(!blur){renderer.render(scene,cam);S.drawImage(D,dx,dy,w,h);return;}
  ghost(true);renderer.render(scene,cam);ghost(false);
  S.drawImage(D,dx,dy,w,h);S.save();S.beginPath();S.rect(dx,dy,w,h);S.clip();S.filter=`blur(${blur}px)`;S.drawImage(D,dx,dy,w,h);S.drawImage(D,dx,dy,w,h);S.restore();

}
