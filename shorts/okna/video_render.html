<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Круглые иллюминаторы</title>
<style>
  html,body{margin:0;background:#0B0F17;color:#fff;font-family:Montserrat,Inter,sans-serif}
  #wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
  canvas{width:min(100vw - 20px,(100vh - 90px)*0.5625);height:auto;aspect-ratio:9/16;background:#000;border-radius:12px}
  #ui{display:flex;gap:8px;align-items:center;width:min(100vw - 20px,540px)}
  #ui button{background:#FACC15;border:0;border-radius:8px;padding:8px 14px;font-weight:800}
  #ui input{flex:1} #ui span{font:700 13px Inter,sans-serif;color:#cbd5e1;min-width:50px}
  body.noui #ui{display:none} body.noui #wrap{padding:0;gap:0}
  body.noui canvas{width:1080px;height:1920px;border-radius:0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>
  <div id="ui"><button id="bPlay">⏸</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="tm">0.0s</span></div>
</div>
<script>
'use strict';
const W = 1080, H = 1920, DUR = 10.6, FONT = 'Inter';
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
let T = 0, playing = true;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const easeOut = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);

/* shots: img, start, end, zoom from→to, focus from→to (0..1), extra fx */
const SHOTS = [
  { img: 'img/s1.png', t0: 0.0, t1: 1.4, z: [1.0, 1.12], f: [[0.45, 0.35], [0.4, 0.3]] },
  { img: 'img/s2.png', t0: 1.4, t1: 2.3, z: [1.06, 1.2], f: [[0.45, 0.3], [0.38, 0.28]] },
  { img: 'img/s3.png', t0: 2.3, t1: 4.6, z: [1.14, 1.02], f: [[0.75, 0.35], [0.45, 0.35]] },
  { img: 'img/s4.png', t0: 4.6, t1: 6.0, z: [1.0, 1.18], f: [[0.5, 0.3], [0.5, 0.28]], pulse: 5.45 },
  { img: 'img/s5.png', t0: 6.0, t1: 7.5, z: [1.04, 1.1], f: [[0.4, 0.3], [0.35, 0.25]], punch: 6.55 },
  { img: 'img/s6.png', t0: 7.5, t1: 9.0, z: [1.2, 1.02], f: [[0.45, 0.3], [0.45, 0.3]] },
  { img: 'img/s7.png', t0: 9.0, t1: DUR, z: [1.0, 1.12], f: [[0.4, 0.3], [0.35, 0.25]] },
];
const CUTS = [2.3, 7.5];           // [ш] – тёмные полосы
const FLASH = [1.4, 4.6, 6.0, 9.0]; // лёгкая вспышка на обычных склейках
SHOTS.forEach(s => { s.el = new Image(); s.el.src = s.img; });

/* субтитры: 1–2 слова, как в примере; * = красное слово */
const SUBS = [
  [0.10, 'ПОЧЕМУ ОКНА'], [0.75, 'В САМОЛЁТЕ'], [1.40, 'КРУГЛЫЕ?'],
  [2.30, 'В ПЯТИДЕСЯТЫХ'], [3.10, 'ИХ ДЕЛАЛИ'], [3.65, 'КВАДРАТНЫМИ'],
  [4.60, 'ДАВЛЕНИЕ'], [5.10, 'БИЛО В'], [5.45, '*УГЛЫ'],
  [6.00, 'И КОРПУС'], [6.55, '*ТРЕСКАЛСЯ'],
  [7.50, 'КРУГ'], [7.85, 'РАСПРЕДЕЛЯЕТ'], [8.50, 'НАГРУЗКУ'],
  [9.10, 'ПОЭТОМУ ОНИ'], [9.70, 'КРУГЛЫЕ'],
];
const SUB_END = 10.45;

function drawShot(s, t) {
  const lt = t - s.t0, k = ease(lt / (s.t1 - s.t0));
  let z = lerp(s.z[0], s.z[1], k);
  const fx = lerp(s.f[0][0], s.f[1][0], k) * W, fy = lerp(s.f[0][1], s.f[1][1], k) * H;
  let sx = 0, sy = 0;
  if (s.punch && t > s.punch) {
    const p = t - s.punch; z *= lerp(1, 1.25, easeOut(p / 0.15));
    const a = 16 * Math.max(0, 1 - p / 0.7); sx = Math.sin(t * 73) * a; sy = Math.cos(t * 61) * a;
  }
  if (s.pulse && t > s.pulse) { const p = t - s.pulse; z *= 1 + 0.06 * Math.exp(-p * 6) ; const a = 8 * Math.max(0, 1 - p / 0.4); sx = Math.sin(t * 80) * a; }
  ctx.save();
  ctx.translate(fx + sx, fy + sy); ctx.scale(z, z); ctx.translate(-fx, -fy);
  if (s.el.complete && s.el.naturalWidth) ctx.drawImage(s.el, 0, 0, W, H);
  ctx.restore();
  if (s.pulse && t > s.pulse) { const p = t - s.pulse; ctx.fillStyle = `rgba(229,57,53,${0.28 * Math.exp(-p * 4)})`; ctx.fillRect(0, 0, W, H); }
  if (s.punch && t > s.punch) { const p = t - s.punch; ctx.fillStyle = `rgba(255,255,255,${0.5 * Math.exp(-p * 12)})`; ctx.fillRect(0, 0, W, H); }
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.3, W / 2, H * 0.5, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.4)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawSubs(t) {
  let i = -1; for (let j = 0; j < SUBS.length; j++) if (t >= SUBS[j][0]) i = j;
  if (i < 0 || t > SUB_END) return;
  const [t0, raw] = SUBS[i], danger = raw.startsWith('*'), txt = raw.replace('*', '');
  const p = t - t0, sc = p < 0.12 ? lerp(1.25, 1, easeOut(p / 0.12)) : 1;
  ctx.save(); ctx.translate(W / 2, 1340); ctx.scale(sc, sc);
  let size = 96; ctx.font = `900 ${size}px ${FONT}`;
  while (ctx.measureText(txt).width > 960 && size > 60) { size -= 4; ctx.font = `900 ${size}px ${FONT}`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
  ctx.lineWidth = 16; ctx.strokeStyle = '#0B0B0F'; ctx.strokeText(txt, 0, 0);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = danger ? '#FF3B30' : '#FFFFFF'; ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function transitions(t) {
  CUTS.forEach(tc => {
    const p = (t - (tc - 0.12)) / 0.28; if (p < 0 || p > 1) return;
    const r = rng(Math.round(tc * 100));
    for (let i = 0; i < 9; i++) {
      const w = 60 + r() * 170, sp = 0.6 + r() * 0.8, x0 = r() * W;
      const x = ((x0 + (p - 0.5) * W * 2.4 * sp) % (W + 300) + W + 300) % (W + 300) - 150;
      ctx.fillStyle = `rgba(6,8,14,${0.8 + r() * 0.15})`; ctx.fillRect(x, 0, w, H);
    }
    ctx.fillStyle = `rgba(6,8,14,${Math.sin(p * Math.PI) * 0.5})`; ctx.fillRect(0, 0, W, H);
  });
  FLASH.forEach(tc => { const p = t - tc; if (p >= 0 && p < 0.15) { ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - p / 0.15)})`; ctx.fillRect(0, 0, W, H); } });
}
function render(t) {
  t = clamp(t, 0, DUR);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let s = SHOTS[0]; for (const x of SHOTS) if (t >= x.t0) s = x;
  drawShot(s, t); vignette(); drawSubs(t); transitions(t);
}

const qs = new URLSearchParams(location.search);
if (qs.get('ui') === '0') document.body.classList.add('noui');
if (qs.has('t')) { T = parseFloat(qs.get('t')) || 0; playing = false; }
const bPlay = document.getElementById('bPlay'), seek = document.getElementById('seek'), tm = document.getElementById('tm');
bPlay.onclick = () => { playing = !playing; bPlay.textContent = playing ? '⏸' : '▶'; };
seek.oninput = () => { T = seek.value / 1000 * DUR; };
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) { T += dt; if (T > DUR) T = 0; }
  render(T); seek.value = Math.round(T / DUR * 1000); tm.textContent = T.toFixed(1) + 's';
  requestAnimationFrame(frame);
}
Promise.all([document.fonts ? document.fonts.ready : 0, ...SHOTS.map(s => s.el.decode().catch(() => {}))]).then(() => { window.READY = true; render(T); requestAnimationFrame(frame); });
</script>
</body>
</html>
