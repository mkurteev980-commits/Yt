<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blocky cast v2</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
</head>
<body>
<script type="module">
// Look test v2: closer to the "game engine" feel of the reference (soft PBR light, real shadows, textured lawn,
// brick houses, chunky round trees), with our OWN block-figure cast: square-ish heads, blocky torso and limbs of equal
// width, simple drawn faces, layered block hair. No outlines, no toon bands.
import * as THREE from "three";
import { RoundedBoxGeometry } from "./addons/RoundedBoxGeometry.js";

const W = 720, H = 960;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 600);

const tex = (w, h, draw, rep = [1, 1]) => {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 8; return t;
};
let seed = 3; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const noisy = (base, spread, n, size) => (g, w, h) => {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) { const c = spread[Math.floor(rnd() * spread.length)]; g.fillStyle = c; g.globalAlpha = 0.35 + rnd() * 0.4; g.fillRect(rnd() * w, rnd() * h, size * (0.5 + rnd()), size * (0.5 + rnd())); }
  g.globalAlpha = 1;
};

// sky with soft clouds
const skyT = tex(512, 1024, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#1f6fd6"); gr.addColorStop(0.55, "#5ea6ee"); gr.addColorStop(1, "#bfe0fb");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = "rgba(255,255,255,0.55)";
  for (let i = 0; i < 14; i++) { const x = rnd() * w, y = 200 + rnd() * 500, r = 30 + rnd() * 60; g.beginPath(); g.ellipse(x, y, r * 2.2, r * 0.6, 0, 0, Math.PI * 2); g.fill(); }
});
scene.background = skyT;
scene.fog = new THREE.Fog("#bfe0fb", 45, 170);

scene.add(new THREE.HemisphereLight("#d6ecff", "#6f8a52", 1.15));
const sun = new THREE.DirectionalLight("#fff4e0", 3.2);
sun.position.set(-14, 26, 12); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 90 }); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02;
scene.add(sun);

const std = (o) => new THREE.MeshStandardMaterial({ roughness: 0.75, metalness: 0, ...o });
const mesh = (geo, mat, cast = true) => { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; };
const rbox = (w, h, d, r = 0.04) => new RoundedBoxGeometry(w, h, d, 3, r);

// ---- ground ----
const grassT = tex(512, 512, noisy("#4fa83a", ["#5cb845", "#449a31", "#66c24f", "#3e8f2e"], 2600, 4), [60, 60]);
const ground = mesh(new THREE.PlaneGeometry(400, 400), std({ map: grassT, roughness: 0.95 }), false); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const slabT = tex(256, 256, (g, w, h) => { noisy("#c9c6c0", ["#d3d0ca", "#bdbab4"], 400, 6)(g, w, h); g.strokeStyle = "rgba(90,90,95,0.45)"; g.lineWidth = 3; g.strokeRect(0, 0, w, h); }, [100, 1.6]);
const walk = mesh(new THREE.BoxGeometry(400, 0.12, 3.4), std({ map: slabT }), false); walk.position.set(0, 0.06, 2.6); scene.add(walk);
const asphaltT = tex(512, 512, noisy("#4d5056", ["#55585e", "#45484e", "#5d6066"], 3000, 3), [80, 2]);
const road = mesh(new THREE.PlaneGeometry(400, 10), std({ map: asphaltT, roughness: 0.9 }), false); road.rotation.x = -Math.PI / 2; road.position.set(0, 0.01, 9.5); scene.add(road);
const curb = mesh(new THREE.BoxGeometry(400, 0.22, 0.35), std({ color: "#b9b6af" })); curb.position.set(0, 0.11, 4.4); scene.add(curb);
for (let x = -60; x < 60; x += 5) { const l = mesh(new THREE.PlaneGeometry(2.4, 0.22), std({ color: "#f2ecd8" }), false); l.rotation.x = -Math.PI / 2; l.position.set(x, 0.015, 9.5); scene.add(l); }

// ---- houses ----
const brickT = tex(512, 512, (g, w, h) => {
  g.fillStyle = "#c9c2b8"; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 ? -32 : 0; x < w; x += 64) {
    const k = rnd(); g.fillStyle = k < 0.33 ? "#a8432f" : k < 0.66 ? "#b44d36" : "#9c3d2b"; g.fillRect(x + 3, y + 3, 58, 26);
  }
}, [3, 2]);
const sidingT = (col) => tex(256, 256, (g, w, h) => { g.fillStyle = col; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(0,0,0,0.08)"; for (let y = 0; y < h; y += 16) g.fillRect(0, y, w, 3); }, [3, 3]);
const winT = tex(128, 128, (g) => {
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, 128, 128);
  const gr = g.createLinearGradient(0, 10, 0, 118); gr.addColorStop(0, "#8fc4ee"); gr.addColorStop(1, "#3c74ad"); g.fillStyle = gr; g.fillRect(10, 10, 108, 108);
  g.fillStyle = "rgba(255,255,255,0.45)"; g.beginPath(); g.moveTo(20, 110); g.lineTo(48, 14); g.lineTo(62, 14); g.lineTo(34, 110); g.fill();
  g.fillStyle = "#ffffff"; g.fillRect(60, 10, 8, 108); g.fillRect(10, 60, 108, 8);
});
const house = (x, z, wallMat, roofCol, w = 9, h = 5) => {
  const b = mesh(new THREE.BoxGeometry(w, h, 7.5), wallMat); b.position.set(x, h / 2, z); scene.add(b);
  const shape = new THREE.Shape([new THREE.Vector2(-w / 2 - 0.5, 0), new THREE.Vector2(w / 2 + 0.5, 0), new THREE.Vector2(0, 2.9)]);
  const rg = new THREE.ExtrudeGeometry(shape, { depth: 8.3, bevelEnabled: false }); rg.translate(0, 0, -4.15);
  const r = mesh(rg, std({ color: roofCol, roughness: 0.85 })); r.position.set(x, h, z); scene.add(r);
  for (const [wx, wy] of [[-w / 4, h * 0.62], [w / 4, h * 0.62]]) {
    const fr = mesh(new THREE.BoxGeometry(1.7, 1.7, 0.12), std({ color: "#ffffff" })); fr.position.set(x + wx, wy, z + 3.76); scene.add(fr);
    const gl = mesh(new THREE.PlaneGeometry(1.5, 1.5), std({ map: winT, roughness: 0.25 }), false); gl.position.set(x + wx, wy, z + 3.83); scene.add(gl);
  }
  const door = mesh(new THREE.BoxGeometry(1.3, 2.4, 0.14), std({ color: "#2f4e7a" })); door.position.set(x, 1.2, z + 3.78); scene.add(door);
  const knob = mesh(new THREE.SphereGeometry(0.06, 10, 8), std({ color: "#e0c46a", metalness: 0.8, roughness: 0.3 })); knob.position.set(x + 0.45, 1.2, z + 3.88); scene.add(knob);
  const step = mesh(new THREE.BoxGeometry(2.4, 0.25, 1.2), std({ color: "#d2cec6" })); step.position.set(x, 0.12, z + 4.3); scene.add(step);
};
house(-10.5, -6.5, std({ map: brickT }), "#3f4650");
house(0.5, -8.5, std({ map: sidingT("#a9c7e2") }), "#4a5260", 10, 5.6);
house(12, -6.5, std({ map: sidingT("#f1e6cf") }), "#6b4a3a");
// fence, trees, bushes, mailbox, lamp post
const white = std({ color: "#f4f4f2" });
for (let x = -16; x < 18; x += 1.2) { const p = mesh(rbox(0.16, 1.0, 0.16, 0.03), white); p.position.set(x, 0.5, 0.6); scene.add(p); }
for (const y of [0.35, 0.8]) { const r = mesh(new THREE.BoxGeometry(34, 0.12, 0.08), white); r.position.set(1, y, 0.6); scene.add(r); }
const leafT = tex(256, 256, noisy("#3d8f34", ["#4aa23e", "#357f2d", "#56b048", "#2f7327"], 1400, 9));
const tree = (x, z, s = 1) => {
  const t = mesh(new THREE.CylinderGeometry(0.25 * s, 0.35 * s, 3 * s, 10), std({ color: "#6e4a30" })); t.position.set(x, 1.5 * s, z); scene.add(t);
  for (const [dx, dy, dz, r] of [[0, 3.9, 0, 1.8], [-1.1, 3.3, 0.3, 1.25], [1.0, 3.4, -0.3, 1.3], [0.1, 4.9, -0.2, 1.15], [0.3, 3.4, 0.9, 1.1]]) {
    const b = mesh(new THREE.IcosahedronGeometry(r * s, 2), std({ map: leafT, roughness: 0.9, flatShading: true })); b.position.set(x + dx * s, dy * s, z + dz * s); scene.add(b);
  }
};
tree(6.4, -1.4); tree(-5.6, -1.8, 0.85); tree(19, -2, 1.1);
for (let i = 0; i < 6; i++) { const b = mesh(new THREE.IcosahedronGeometry(0.75, 2), std({ map: leafT, flatShading: true })); b.position.set(-14 + i * 1.5, 0.55, -2.8); b.scale.set(1.2, 0.8, 1); scene.add(b); }
const mailP = mesh(new THREE.BoxGeometry(0.14, 1.2, 0.14), std({ color: "#5b4636" })); mailP.position.set(-3.6, 0.6, 1.2); scene.add(mailP);
const mailB = mesh(rbox(0.5, 0.45, 0.8, 0.12), std({ color: "#2e5ea6", metalness: 0.3, roughness: 0.5 })); mailB.position.set(-3.6, 1.4, 1.2); scene.add(mailB);
const lamp = mesh(new THREE.CylinderGeometry(0.08, 0.1, 5, 10), std({ color: "#2f3338", metalness: 0.6, roughness: 0.4 })); lamp.position.set(9.2, 2.5, 4.2); scene.add(lamp);
const lampH = mesh(rbox(0.5, 0.3, 0.5, 0.06), std({ color: "#2f3338" })); lampH.position.set(9.2, 5.1, 4.2); scene.add(lampH);

// ---- our block figures ----
/** simple drawn face: almond eyes with a dark iris, short brows, small mouth (no outline, no shine) */
const faceTex = (o) => tex(256, 256, (g) => {
  g.clearRect(0, 0, 256, 256);
  for (const x of [92, 164]) {
    g.fillStyle = "#ffffff"; g.beginPath(); g.ellipse(x, 120, 17, o.wide ? 20 : 14, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = o.iris; g.beginPath(); g.ellipse(x + o.look * 5, 122, 10, o.wide ? 13 : 10, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#151218"; g.beginPath(); g.ellipse(x + o.look * 5, 123, 5, 6, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = o.brow; g.lineWidth = 7; g.lineCap = "round"; g.beginPath();
    const s = x < 128 ? -1 : 1; g.moveTo(x - 17, 92 + o.browTilt * s * -5); g.lineTo(x + 17, 92 + o.browTilt * s * 5); g.stroke();
  }
  g.strokeStyle = "#5a2a2a"; g.lineWidth = 6; g.lineCap = "round";
  if (o.mouth === "smile") { g.beginPath(); g.arc(128, 160, 22, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
  else if (o.mouth === "open") { g.fillStyle = "#6a2430"; g.beginPath(); g.ellipse(128, 176, 14, 11, 0, 0, Math.PI * 2); g.fill(); }
  else { g.beginPath(); g.moveTo(112, 178); g.quadraticCurveTo(128, 186, 144, 176); g.stroke(); }
  if (o.glasses) { g.strokeStyle = "#2a2522"; g.lineWidth = 5; for (const x of [92, 164]) { g.beginPath(); g.arc(x, 121, 26, 0, Math.PI * 2); g.stroke(); } g.beginPath(); g.moveTo(118, 118); g.lineTo(138, 118); g.stroke(); }
});

const figure = (o) => {
  const root = new THREE.Group();
  const skin = std({ color: o.skin, roughness: 0.6 }), top = std({ map: o.topMap ?? null, color: o.topMap ? "#ffffff" : o.top }), pants = std({ color: o.pants }), shoes = std({ color: o.shoe }), hair = std({ color: o.hair, roughness: 0.55 });
  const L = 1.0, legW = 0.48;
  for (const s of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(s * 0.25, L, 0); leg.rotation.x = o.legs?.[s > 0 ? 1 : 0] ?? 0;
    const l = mesh(rbox(legW, L, legW, 0.03), pants); l.position.y = -L / 2; leg.add(l);
    const f = mesh(rbox(0.5, 0.16, 0.56, 0.05), shoes); f.position.set(0, -L + 0.08, 0.04); leg.add(f);
    root.add(leg);
  }
  const torso = mesh(rbox(1.0, 1.0, 0.5, 0.04), top); torso.position.y = L + 0.5; root.add(torso);
  for (const s of [-1, 1]) {
    const arm = new THREE.Group(); arm.position.set(s * 0.75, L + 0.95, 0);
    const [ax, az] = o.arms[s > 0 ? 1 : 0]; arm.rotation.set(ax, 0, az * s);
    const a = mesh(rbox(0.48, 0.62, 0.48, 0.03), top); a.position.y = -0.3; arm.add(a);
    const h = mesh(rbox(0.46, 0.4, 0.46, 0.05), skin); h.position.y = -0.8; arm.add(h);
    root.add(arm);
  }
  const head = new THREE.Group(); head.position.y = L + 1.0 + 0.42; head.rotation.set(...(o.head ?? [0, 0, 0]));
  head.add(mesh(rbox(0.82, 0.82, 0.8, 0.12), skin));
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), std({ map: faceTex(o.face), transparent: true, roughness: 0.6 })); face.position.z = 0.405; head.add(face);
  const H = (w, h, d, x, y, z, rx = 0, rz = 0) => { const m = mesh(rbox(w, h, d, Math.min(w, h, d) * 0.25), hair); m.position.set(x, y, z); m.rotation.set(rx, 0, rz); head.add(m); };
  if (o.hairKind === "messy") { // layered fringe of blocks, swept
    H(0.92, 0.28, 0.9, 0, 0.43, -0.02);
    for (let i = 0; i < 6; i++) H(0.2, 0.32, 0.28, -0.36 + i * 0.145, 0.3 - (i % 2) * 0.05, 0.38, -0.25, (i - 2.5) * 0.12);
    for (const s of [-1, 1]) H(0.14, 0.42, 0.7, s * 0.46, 0.18, -0.05);
    H(0.9, 0.5, 0.2, 0, 0.18, -0.45);
  } else if (o.hairKind === "bob") {
    H(0.94, 0.3, 0.92, 0, 0.42, 0); H(0.98, 0.7, 0.3, 0, 0.1, -0.36);
    for (const s of [-1, 1]) H(0.16, 0.72, 0.72, s * 0.48, 0.08, -0.04);
    H(0.8, 0.16, 0.18, 0, 0.32, 0.38, -0.2);
  } else if (o.hairKind === "cap") {
    const c = std({ color: o.cap }); const m = mesh(rbox(0.9, 0.26, 0.88, 0.06), c); m.position.set(0, 0.45, 0); head.add(m);
    const brim = mesh(rbox(0.86, 0.06, 0.4, 0.02), c); brim.position.set(0, 0.34, 0.55); head.add(brim);
    for (const s of [-1, 1]) H(0.08, 0.3, 0.5, s * 0.43, 0.15, -0.08);
  }
  root.add(head);
  root.position.set(...o.pos); root.rotation.y = o.yaw ?? 0;
  scene.add(root);
};
const stripes = (a, b) => tex(128, 128, (g) => { g.fillStyle = a; g.fillRect(0, 0, 128, 128); g.fillStyle = b; for (let y = 0; y < 128; y += 32) g.fillRect(0, y, 128, 14); });

figure({ pos: [-1.9, 0.12, 2.7], yaw: 0.3, skin: "#f1c7a3", topMap: stripes("#2b2f38", "#8a93a3"), pants: "#23262c", shoe: "#f2f2f2", hair: "#5a3a26", hairKind: "messy",
  arms: [[0, 0.06], [0, 2.6]], head: [0, 0.12, 0.05],
  face: { iris: "#5a3a22", brow: "#4a2e1c", browTilt: -0.3, mouth: "smile", look: 0.3 } });
figure({ pos: [0.6, 0.12, 3.1], yaw: -0.1, skin: "#d8a27a", top: "#e05a6a", pants: "#3c5fa8", shoe: "#ffffff", hair: "#1e1714", hairKind: "bob",
  arms: [[-1.2, 0.1], [0, 0.08]], head: [0, -0.1, -0.04],
  face: { iris: "#3a2516", brow: "#1e1714", browTilt: 0.15, mouth: "open", look: -0.5, wide: true } });
figure({ pos: [3.1, 0.12, 2.6], yaw: -0.4, skin: "#f3d7bf", top: "#3f7d4a", pants: "#6a6e76", shoe: "#3a2a20", hair: "#dcdcdc", hairKind: "cap", cap: "#c0392b",
  arms: [[0.1, 0.3], [-0.5, 0.2]], head: [0.06, -0.15, 0],
  face: { iris: "#3d5774", brow: "#d0d0d0", browTilt: 0.4, mouth: "flat", look: -0.4, glasses: true } });

cam.position.set(0.7, 2.6, 13.5); cam.lookAt(0.7, 2.0, 2.8);
renderer.render(scene, cam);
document.title = "READY";
</script>
</body>
</html>
