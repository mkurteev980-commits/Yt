<!doctype html>

  @font-face { font-family: "Fredoka"; src: url("fonts/fredoka-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
  html,body{margin:0;background:#000;overflow:hidden} canvas{display:block}
</style>
<script type="importmap">{ "imports": { "three": "./three.module.js", "three/addons/": "./jsm/" } }</script>
</head>
<body>
<canvas id="out"></canvas>
<script type="module">
// "Grandpa's House" — ~15 s trial in the blocky-town format: our own block figures in a soft-lit 3D street, one-word
// captions with coloured key words. render(t) is a pure function of time (frames are captured by scripts/capture.mjs).
import * as THREE from "three";
import { RoundedBoxGeometry } from "./addons/RoundedBoxGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { SMAAPass } from "three/addons/postprocessing/SMAAPass.js";
import { Sky } from "three/addons/objects/Sky.js";

const W = 1080, H = 1440, DUR = 15.3;
const out = document.getElementById("out"); out.width = W; out.height = H;
const octx = out.getContext("2d");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 600);

// ---------------- helpers ----------------
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - (1 - clamp01(x)) ** 3;
const backOut = (x) => { x = clamp01(x); const c = 1.8; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const L3 = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
let seed = 3; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const tex = (w, h, draw, rep = [1, 1]) => {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 8; return t;
};
const noisy = (base, spread, n, size) => (g, w, h) => {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) { g.fillStyle = spread[Math.floor(rnd() * spread.length)]; g.globalAlpha = 0.35 + rnd() * 0.4; g.fillRect(rnd() * w, rnd() * h, size * (0.5 + rnd()), size * (0.5 + rnd())); }
  g.globalAlpha = 1;
};
const std = (o) => new THREE.MeshStandardMaterial({ roughness: 0.75, metalness: 0, ...o });
const mesh = (geo, mat, cast = true) => { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; };
const rbox = (w, h, d, r = 0.04) => new RoundedBoxGeometry(w, h, d, 3, r);

// ---------------- sky + light presets ----------------
const skyTex = (stops, cloud) => tex(512, 1024, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); stops.forEach(([k, c]) => gr.addColorStop(k, c)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = cloud; for (let i = 0; i < 14; i++) { const x = rnd() * w, y = 220 + rnd() * 480, r = 30 + rnd() * 60; g.beginPath(); g.ellipse(x, y, r * 2.2, r * 0.6, 0, 0, Math.PI * 2); g.fill(); }
});
const LOOKS = {
  day: { sky: skyTex([[0, "#1f6fd6"], [0.55, "#5ea6ee"], [1, "#bfe0fb"]], "rgba(255,255,255,0.55)"), fog: "#bfe0fb", sun: "#fff4e0", sunI: 3.2, hemi: ["#d6ecff", "#6f8a52", 1.15], el: 50, exp: 1.15 },
  dawn: { sky: skyTex([[0, "#3d5aa8"], [0.5, "#e98a8a"], [1, "#ffcf8a"]], "rgba(255,210,190,0.55)"), fog: "#f6c7a2", sun: "#ffbe7a", sunI: 3.4, hemi: ["#ffe0c4", "#7a6a7a", 1.3], el: 12, exp: 1.1 },
  dusk: { sky: skyTex([[0, "#2e3f8f"], [0.5, "#d9708a"], [1, "#ffb067"]], "rgba(255,190,170,0.5)"), fog: "#f0b896", sun: "#ffa55e", sunI: 3.6, hemi: ["#ffd8c0", "#7a6a8a", 1.35], el: 12, exp: 1.12 },
};
scene.fog = new THREE.Fog("#bfe0fb", 45, 170);
const hemi = new THREE.HemisphereLight("#d6ecff", "#6f8a52", 1.15); scene.add(hemi);
const sun = new THREE.DirectionalLight("#fff4e0", 3.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4;
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 120 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const sky = new Sky(); sky.scale.setScalar(4000); scene.add(sky);
const SKYP = { day: [1.4, 2.6, 0.003, 0.78], dawn: [4, 2.2, 0.005, 0.84], dusk: [4.5, 2.4, 0.005, 0.85] };
const applyLook = (name, az = -35) => {
  const L = LOOKS[name]; sky.visible = name !== "day"; scene.background = name === "day" ? L.sky : null; scene.fog.color.set(L.fog); scene.fog.far = 330;
  const [tb, ray, mie, mg] = SKYP[name], u = sky.material.uniforms;
  u.turbidity.value = tb; u.rayleigh.value = ray; u.mieCoefficient.value = mie; u.mieDirectionalG.value = mg;
  sun.color.set(L.sun); sun.intensity = L.sunI; hemi.color.set(L.hemi[0]); hemi.groundColor.set(L.hemi[1]); hemi.intensity = L.hemi[2];
  const el = THREE.MathUtils.degToRad(L.el), a = THREE.MathUtils.degToRad(az);
  sun.position.set(Math.sin(a) * Math.cos(el) * 60, Math.sin(el) * 60, Math.cos(a) * Math.cos(el) * 60); sun.target.position.set(0, 0, 0);
  renderer.toneMappingExposure = L.exp * (name === "day" ? 0.78 : 1.0);
  u.sunPosition.value.copy(sun.position).normalize();
};

// ---------------- the street ----------------
const grassT = tex(512, 512, noisy("#4fa83a", ["#5cb845", "#449a31", "#66c24f", "#3e8f2e"], 2600, 4), [60, 60]);
const ground = mesh(new THREE.PlaneGeometry(400, 400), std({ map: grassT, roughness: 0.95 }), false); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const slabT = tex(256, 256, (g, w, h) => { noisy("#c9c6c0", ["#d3d0ca", "#bdbab4"], 400, 6)(g, w, h); g.strokeStyle = "rgba(90,90,95,0.45)"; g.lineWidth = 3; g.strokeRect(0, 0, w, h); }, [100, 1.6]);
const walk = mesh(new THREE.BoxGeometry(400, 0.12, 3.4), std({ map: slabT }), false); walk.position.set(0, 0.06, 2.6); scene.add(walk);
const asphaltT = tex(512, 512, noisy("#4d5056", ["#55585e", "#45484e", "#5d6066"], 3000, 3), [80, 2]);
const road = mesh(new THREE.PlaneGeometry(400, 10), std({ map: asphaltT, roughness: 0.9 }), false); road.rotation.x = -Math.PI / 2; road.position.set(0, 0.01, 9.5); scene.add(road);
const curb = mesh(new THREE.BoxGeometry(400, 0.22, 0.35), std({ color: "#b9b6af" })); curb.position.set(0, 0.11, 4.4); scene.add(curb);
for (let x = -60; x < 60; x += 5) { const l = mesh(new THREE.PlaneGeometry(2.4, 0.22), std({ color: "#f2ecd8" }), false); l.rotation.x = -Math.PI / 2; l.position.set(x, 0.015, 9.5); scene.add(l); }
const brickT = tex(512, 512, (g, w, h) => {
  g.fillStyle = "#c9c2b8"; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 ? -32 : 0; x < w; x += 64) { const k = rnd(); g.fillStyle = k < 0.33 ? "#a8432f" : k < 0.66 ? "#b44d36" : "#9c3d2b"; g.fillRect(x + 3, y + 3, 58, 26); }
}, [3, 2]);
const sidingT = (col) => tex(256, 256, (g, w, h) => { g.fillStyle = col; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(0,0,0,0.08)"; for (let y = 0; y < h; y += 16) g.fillRect(0, y, w, 3); }, [3, 3]);
const winT = tex(128, 128, (g) => {
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, 128, 128);
  const gr = g.createLinearGradient(0, 10, 0, 118); gr.addColorStop(0, "#8fc4ee"); gr.addColorStop(1, "#3c74ad"); g.fillStyle = gr; g.fillRect(10, 10, 108, 108);
  g.fillStyle = "rgba(255,255,255,0.45)"; g.beginPath(); g.moveTo(20, 110); g.lineTo(48, 14); g.lineTo(62, 14); g.lineTo(34, 110); g.fill();
  g.fillStyle = "#ffffff"; g.fillRect(60, 10, 8, 108); g.fillRect(10, 60, 108, 8);
});
const gable = (w, d, h, col) => {
  const shape = new THREE.Shape([new THREE.Vector2(-w / 2 - 0.45, 0), new THREE.Vector2(w / 2 + 0.45, 0), new THREE.Vector2(0, h)]);
  const g = new THREE.ExtrudeGeometry(shape, { depth: d + 0.8, bevelEnabled: false }); g.translate(0, 0, -(d + 0.8) / 2);
  return mesh(g, std({ color: col, roughness: 0.85 }));
};
const house = (x, z, wallMat, roofCol, w = 9, h = 5) => {
  const b = mesh(new THREE.BoxGeometry(w, h, 7.5), wallMat); b.position.set(x, h / 2, z); scene.add(b);
  const r = gable(w, 7.5, 2.9, roofCol); r.position.set(x, h, z); scene.add(r);
  for (const wx of [-w / 4, w / 4]) {
    const fr = mesh(new THREE.BoxGeometry(1.7, 1.7, 0.12), std({ color: "#ffffff" })); fr.position.set(x + wx, h * 0.62, z + 3.76); scene.add(fr);
    const gl = mesh(new THREE.PlaneGeometry(1.5, 1.5), std({ map: winT, roughness: 0.25 }), false); gl.position.set(x + wx, h * 0.62, z + 3.83); scene.add(gl);
  }
  const door = mesh(new THREE.BoxGeometry(1.3, 2.4, 0.14), std({ color: "#2f4e7a" })); door.position.set(x, 1.2, z + 3.78); scene.add(door);
  const step = mesh(new THREE.BoxGeometry(2.4, 0.25, 1.2), std({ color: "#d2cec6" })); step.position.set(x, 0.12, z + 4.3); scene.add(step);
};
house(-11, -8.5, std({ map: brickT }), "#3f4650");
house(0, -8.5, std({ map: sidingT("#a9c7e2") }), "#4a5260", 10, 5.6); // the neighbours' house: grandpa builds in its front yard
house(11.5, -8.5, std({ map: sidingT("#f1e6cf") }), "#6b4a3a");
const white = std({ color: "#f4f4f2" });
for (let x = -16; x < 18; x += 1.2) { if (Math.abs(x) < 1.4) continue; const p = mesh(rbox(0.16, 1.0, 0.16, 0.03), white); p.position.set(x, 0.5, 0.6); scene.add(p); }
for (const y of [0.35, 0.8]) for (const [x0, x1] of [[-16, -1.4], [1.4, 18]]) { const r = mesh(new THREE.BoxGeometry(x1 - x0, 0.12, 0.08), white); r.position.set((x0 + x1) / 2, y, 0.6); scene.add(r); }
const leafT = tex(256, 256, noisy("#3d8f34", ["#4aa23e", "#357f2d", "#56b048", "#2f7327"], 1400, 9));
const tree = (x, z, s = 1) => {
  const t = mesh(new THREE.CylinderGeometry(0.25 * s, 0.35 * s, 3 * s, 10), std({ color: "#6e4a30" })); t.position.set(x, 1.5 * s, z); scene.add(t);
  for (const [dx, dy, dz, r] of [[0, 3.9, 0, 1.8], [-1.1, 3.3, 0.3, 1.25], [1.0, 3.4, -0.3, 1.3], [0.1, 4.9, -0.2, 1.15], [0.3, 3.4, 0.9, 1.1]]) {
    const b = mesh(new THREE.IcosahedronGeometry(r * s, 2), std({ map: leafT, roughness: 0.9, flatShading: true })); b.position.set(x + dx * s, dy * s, z + dz * s); scene.add(b);
  }
};
tree(6.6, -2.0); tree(-6.3, -2.2, 0.85); tree(19, -2, 1.1); tree(-19, -2.5, 1.0);
// mountains far behind the town
for (let i = 0; i < 9; i++) {
  const h = 45 + rnd() * 40, r = 40 + rnd() * 30, x = -230 + i * 58 + rnd() * 20, z = -200 - rnd() * 60;
  const m = mesh(new THREE.ConeGeometry(r, h, 7), std({ color: "#7d8ea6", flatShading: true, roughness: 1 }), false); m.position.set(x, h / 2 - 2, z); m.rotation.y = rnd() * 3; scene.add(m);
  const c = mesh(new THREE.ConeGeometry(r * 0.38, h * 0.38, 7), std({ color: "#f4f7fb", flatShading: true, roughness: 1 }), false); c.position.set(x, h - h * 0.19 - 1.6, z); c.rotation.y = m.rotation.y; scene.add(c);
}
// second row of houses + trees behind
const roofs = ["#3f4650", "#6b4a3a", "#4a5260", "#7a3b32"], walls = ["#e8dcc4", "#c9d8e8", "#e9c9a8", "#d8d0c4", "#b8c9a8"];
for (let x = -44; x <= 44; x += 11) {
  const w = 8 + rnd() * 2, h = 4.5 + rnd() * 2, z = -24 - rnd() * 3;
  const b = mesh(new THREE.BoxGeometry(w, h, 7), std({ color: walls[Math.floor(rnd() * walls.length)] })); b.position.set(x + rnd() * 2, h / 2, z); scene.add(b);
  const r = gable(w, 7, 2.6, roofs[Math.floor(rnd() * roofs.length)]); r.position.set(b.position.x, h, z); scene.add(r);
  tree(x + 5.5, z + 5 + rnd() * 2, 0.9 + rnd() * 0.3);
}
for (const x of [-24, -15, 24, 30]) tree(x, -3 + rnd() * 2, 0.9 + rnd() * 0.3);
// soft 3D clouds
const cloudM = std({ color: "#ffffff", roughness: 1 });
for (let i = 0; i < 12; i++) {
  const g = new THREE.Group(), cx = -160 + rnd() * 320, cy = 45 + rnd() * 30, cz = -90 - rnd() * 90;
  for (let k = 0; k < 6; k++) { const s2 = 5 + rnd() * 6, b = mesh(new THREE.IcosahedronGeometry(s2, 2), cloudM, false); b.position.set((k - 2.5) * 5 + rnd() * 3, rnd() * 3, rnd() * 4); b.scale.y = 0.65; g.add(b); }
  g.position.set(cx, cy, cz); scene.add(g);
}
// bushes with flowers along the fences (not in the building yard)
const flowerCols = ["#ff5a7a", "#ffd23f", "#ffffff", "#b07cff"];
for (const x of [-14.5, -12, -9.5, -4.2, 4.2, 9.5, 12, 14.5]) {
  const b = mesh(new THREE.IcosahedronGeometry(0.8, 2), std({ map: leafT, flatShading: true })); b.position.set(x, 0.55, -0.3); b.scale.set(1.3, 0.85, 1); scene.add(b);
  for (let k = 0; k < 7; k++) { const f = mesh(new THREE.SphereGeometry(0.09, 8, 6), std({ color: flowerCols[(k + Math.round(x)) & 3], roughness: 0.6 }), false);
    const a = rnd() * Math.PI * 2; f.position.set(x + Math.cos(a) * 0.85, 0.75 + rnd() * 0.35, -0.3 + Math.sin(a) * 0.6); scene.add(f); }
}
// parked car on the far side of the road
{ const car = new THREE.Group(), red = std({ color: "#2f7dd6", metalness: 0.35, roughness: 0.35 }), glass = std({ color: "#1d2b3a", metalness: 0.2, roughness: 0.15 }), tyre = std({ color: "#1b1d22" });
  const body = mesh(rbox(4.2, 0.9, 1.9, 0.25), red); body.position.y = 0.75; car.add(body);
  const cab = mesh(rbox(2.3, 0.8, 1.7, 0.25), red); cab.position.set(-0.2, 1.5, 0); car.add(cab);
  const win = mesh(rbox(2.36, 0.55, 1.74, 0.18), glass); win.position.set(-0.2, 1.52, 0); car.add(win);
  for (const [x, z] of [[1.3, 0.95], [-1.3, 0.95], [1.3, -0.95], [-1.3, -0.95]]) { const w = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.3, 18), tyre); w.rotation.x = Math.PI / 2; w.position.set(x, 0.42, z); car.add(w); }
  car.position.set(-7, 0, 12.6); scene.add(car); }
// fire hydrant
{ const hy = mesh(rbox(0.34, 0.7, 0.34, 0.08), std({ color: "#d63c2f", roughness: 0.45 })); hy.position.set(5.2, 0.47, 3.6); scene.add(hy);
  const cap = mesh(new THREE.SphereGeometry(0.2, 12, 8), std({ color: "#d63c2f", roughness: 0.45 })); cap.position.set(5.2, 0.85, 3.6); scene.add(cap); }
const lamp = mesh(new THREE.CylinderGeometry(0.08, 0.1, 5, 10), std({ color: "#2f3338", metalness: 0.6, roughness: 0.4 })); lamp.position.set(8.6, 2.5, 4.2); scene.add(lamp);

// ---------------- grandpa's block house (in the neighbours' front yard) ----------------
const HB = 0.5, HX = 0, HZ = -2.2, NW = 10, ND = 8, NL = 6; // 5 m x 4 m x 3 m of 0.5 m blocks
const T_BLOCK = 4.68, T_WALL0 = 6.0, T_WALL1 = 7.3, T_ROOF = 8.5, T_DOOR = 8.84, T_MAIL = 9.36;
const blocks = [];
for (let l = 0; l < NL; l++) for (let i = 0; i < 2 * (NW + ND); i++) {
  let x, z;
  if (i < NW) { x = i; z = ND - 1; } else if (i < NW + ND) { x = NW - 1; z = ND - 1 - (i - NW); } else if (i < 2 * NW + ND) { x = NW - 1 - (i - NW - ND); z = 0; } else { x = 0; z = i - 2 * NW - ND; }
  if (z === ND - 1 && x >= 4 && x <= 5 && l < 4) continue; // door gap (front)
  if (z === ND - 1 && (x === 1 || x === 8) && (l === 2 || l === 3)) continue; // window gaps
  if (blocks.some((b) => b.x === x && b.z === z && b.l === l)) continue;
  blocks.push({ x, z, l });
}
blocks.forEach((b, k) => { b.t = T_WALL0 + (k / blocks.length) * (T_WALL1 - T_WALL0 - 0.15); });
const blockMat = std({ map: tex(64, 64, (g) => { g.fillStyle = "#e8d3a8"; g.fillRect(0, 0, 64, 64); g.strokeStyle = "rgba(120,90,60,0.35)"; g.lineWidth = 4; g.strokeRect(2, 2, 60, 60); }) });
const blockIM = new THREE.InstancedMesh(rbox(HB, HB, HB, 0.05), blockMat, blocks.length); blockIM.castShadow = blockIM.receiveShadow = true; scene.add(blockIM);
const bx = (x) => HX - (NW / 2 - 0.5) * HB + x * HB, bz = (z) => HZ - (ND / 2 - 0.5) * HB + z * HB;
const roof = gable(NW * HB, ND * HB, 1.9, "#c0392b"); scene.add(roof);
const door = mesh(new THREE.BoxGeometry(1.0, 2.0, 0.1), std({ color: "#7a4a2a" })); door.position.set(HX, 1.0, bz(ND - 1) + 0.22); scene.add(door);
const wins = [1, 8].map((x) => { const w = mesh(new THREE.PlaneGeometry(0.5, 1.0), std({ map: winT, roughness: 0.25 }), false); w.position.set(bx(x), 1.5, bz(ND - 1) + 0.2); scene.add(w); return w; });
const mail = new THREE.Group(); mail.position.set(HX + 2.0, 0, 0.0); scene.add(mail);
{ const p = mesh(new THREE.BoxGeometry(0.14, 1.2, 0.14), std({ color: "#5b4636" })); p.position.y = 0.6; mail.add(p);
  const b = mesh(rbox(0.5, 0.45, 0.8, 0.12), std({ color: "#c0392b", metalness: 0.3, roughness: 0.5 })); b.position.y = 1.4; mail.add(b);
  const f = mesh(new THREE.BoxGeometry(0.05, 0.35, 0.1), std({ color: "#f1c40f" })); f.position.set(0.28, 1.6, 0.1); mail.add(f); }
const held = mesh(rbox(HB, HB, HB, 0.05), blockMat); scene.add(held);
const puffs = Array.from({ length: 10 }, () => { const m = mesh(new THREE.IcosahedronGeometry(0.5, 1), std({ color: "#e9e4da", transparent: true, opacity: 0.8 }), false); scene.add(m); return m; });

// ---------------- our block figures ----------------
const FACES = new Map();
const faceTex = (o, ex, open) => {
  const key = `${o.iris}|${o.brow}|${o.glasses}|${ex}|${open}`;
  if (FACES.has(key)) return FACES.get(key);
  const t = tex(256, 256, (g) => {
    g.clearRect(0, 0, 256, 256);
    const wide = ex === "shock", happy = ex === "laugh";
    for (const x of [92, 164]) {
      if (happy) { g.strokeStyle = "#151218"; g.lineWidth = 8; g.lineCap = "round"; g.beginPath(); g.arc(x, 128, 15, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke(); }
      else {
        g.fillStyle = "#ffffff"; g.beginPath(); g.ellipse(x, 120, wide ? 21 : 17, wide ? 24 : 14, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = o.iris; g.beginPath(); g.ellipse(x, 122, wide ? 9 : 10, wide ? 9 : 10, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#151218"; g.beginPath(); g.ellipse(x, 123, 5, 5, 0, 0, Math.PI * 2); g.fill();
      }
      const s = x < 128 ? -1 : 1, tilt = ex === "proud" ? -0.4 : ex === "shock" ? 0.8 : happy ? 0.3 : 0;
      g.strokeStyle = o.brow; g.lineWidth = 7; g.lineCap = "round"; g.beginPath();
      g.moveTo(x - 17, (wide ? 84 : 92) + tilt * s * -6); g.lineTo(x + 17, (wide ? 84 : 92) + tilt * s * 6); g.stroke();
    }
    g.strokeStyle = "#5a2a2a"; g.fillStyle = "#6a2430"; g.lineWidth = 6; g.lineCap = "round";
    if (ex === "shock") { g.beginPath(); g.ellipse(128, 180, 15, 20, 0, 0, Math.PI * 2); g.fill(); }

const figure = (o) => {

  const L = 1.0;

    const f = mesh(rbox(0.5, 0.16, 0.56, 0.05), shoes); f.position.set(0, -L + 0.08, 0.04); leg.add(f);

  F.arms = [-1, 1].map((s) => {

    const h = mesh(rbox(0.46, 0.4, 0.46, 0.05), skin); h.position.y = -0.8; arm.add(h);

/** pose: p = { pos, yaw, armL:[x,z], armR:[x,z], legs:[l,r], head:[x,y,z], ex, talk, hop } */
const pose = (F, p, t) => {
  const br = Math.sin(t * 2.6 + F.o.ph) * 0.015;
  F.root.position.set(p.pos[0], (p.y ?? 0.12) + (p.hop ?? 0), p.pos[1]); F.root.rotation.y = p.yaw ?? 0;
  F.root.scale.set(1 - br * 0.5, 1 + br, 1 - br * 0.5);

  F.legs[0].rotation.x = p.legs?.[0] ?? 0; F.legs[1].rotation.x = p.legs?.[1] ?? 0;

const GRANDPA = figure({ skin: "#f3d7bf", top: "#3f7d4a", pants: "#6a6e76", shoe: "#3a2a20", hair: "#dcdcdc", hairKind: "cap", cap: "#c0392b", iris: "#3d5774", brow: "#d6d6d6", glasses: true, moustache: true, ph: 0.3 });
const KID = figure({ skin: "#f1c7a3", topMap: stripes("#2b2f38", "#8a93a3"), pants: "#23262c", shoe: "#f2f2f2", hair: "#5a3a26", hairKind: "messy", iris: "#5a3a22", brow: "#4a2e1c", ph: 1.1 });
const MOM = figure({ skin: "#d8a27a", top: "#e05a6a", pants: "#3c5fa8", shoe: "#ffffff", hair: "#1e1714", hairKind: "bob", iris: "#3a2516", brow: "#1e1714", ph: 2.0 });
const DAD = figure({ skin: "#e9bb92", top: "#3a78c2", pants: "#4a3f35", shoe: "#2a2a2a", hair: "#3b2a1e", hairKind: "short", iris: "#3b2a1e", brow: "#3b2a1e", ph: 2.7 });
const NEIGH = [KID, MOM, DAD];

// ---------------- timeline ----------------
const CUTS = [0, 2.95, 3.9, 5.95, 7.35, 10.0, 11.4, DUR];
const shotOf = (t) => { let i = 0; while (i + 1 < CUTS.length - 1 && t >= CUTS[i + 1]) i++; return i; };
const camKeys = [
  // [from pos, from look, to pos, to look, fov]
  [[0.3, 2.5, 13.0], [0.2, 2.1, 2.0], [0.3, 2.45, 11.2], [0.2, 2.2, 2.2], 42],     // 0 grandpa makes the bet
  [[-0.7, 2.6, 9.4], [-0.7, 2.2, 1.4], [-0.7, 2.55, 8.4], [-0.7, 2.25, 1.4], 40],  // 1 neighbours laugh
  [[3.6, 1.1, 6.4], [0.4, 1.9, -0.6], [3.1, 1.2, 5.6], [0.4, 2.1, -0.6], 44],      // 2 sunrise, one block (low)
  [[7.5, 4.0, 6.5], [0.0, 1.4, -2.2], [6.2, 4.6, 5.6], [0.0, 1.6, -2.2], 44],      // 3 walls rise
  [[-8.6, 2.9, 9.2], [0.4, 2.3, -2.2], [-7.2, 3.1, 7.9], [0.6, 2.5, -2.2], 44],     // 4 roof, door, mailbox
  [[0.2, 2.6, 9.6], [-0.7, 2.2, 1.4], [0.2, 2.55, 8.6], [-0.7, 2.25, 1.4], 40],    // 5 nobody laughs
  [[1.5, 3.2, 12.5], [0.0, 2.6, -3.0], [3.2, 7.5, 17.0], [0.0, 2.8, -4.0], 46],     // 6 reveal: in their front yard
];
const LOOK_OF = ["day", "day", "dawn", "day", "dusk", "dusk", "dusk"];

const render3D = (t) => {
  const s = shotOf(t), t0 = CUTS[s], t1 = CUTS[s + 1], k = ease((t - t0) / (t1 - t0));
  applyLook(LOOK_OF[s], s === 2 ? -70 : s >= 4 ? 70 : -35);
  if (s === 3) { const u = (t - t0) / (t1 - t0); sun.position.set(-50 + 100 * u, 30 + 25 * Math.sin(u * Math.PI), 20); } // timelapse sun sweep
  const [p0, l0, p1, l1, fov] = camKeys[s];
  const sh = s === 6 && t > 13.4 && t < 13.75 ? Math.sin(t * 90) * 0.06 : 0;
  cam.position.set(...L3(p0, p1, k)); cam.lookAt(...L3(l0, l1, k)); cam.position.x += sh; cam.fov = fov; cam.updateProjectionMatrix();

  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  blocks.forEach((b, i) => {
    const u = s >= 3 ? clamp01((t - b.t) / 0.14) : 0, show = u > 0 || s >= 4;
    const y = b.l * HB + HB / 2 + (1 - easeOut(s >= 4 ? 1 : u)) * 2.5;

  door.visible = s >= 4 && t >= T_DOOR; door.scale.setScalar(door.visible ? backOut((t - T_DOOR) / 0.2) : 1);
  wins.forEach((w) => { w.visible = s >= 4 && t >= T_ROOF; });
  mail.visible = (s >= 4 && t >= T_MAIL) || s >= 5; mail.scale.setScalar(s === 4 ? backOut((t - T_MAIL) / 0.25) : 1);
  puffs.forEach((p, i) => {
    const age = t - T_ROOF - 0.28, a = (i / puffs.length) * Math.PI * 2;
    p.visible = s === 4 && age > 0 && age < 0.9;
    if (p.visible) { const r = 2.6 + age * 3; p.position.set(HX + Math.cos(a) * r, NL * HB + 0.2 + age * 0.6, HZ + Math.sin(a) * r * 0.85); p.scale.setScalar(0.6 + age); p.material.opacity = 0.8 * (1 - age / 0.9); }
  });

    show(KID, { pos: [-2.4, 1.9], yaw: 0.35, ex: "smile" }); show(MOM, { pos: [2.6, 1.8], yaw: -0.35, ex: "smile", armL: [0, 0.3], armR: [0, 0.3] });

    show(DAD, { pos: [-0.9, 0.7], yaw: 0.05, ex: "laugh", hop: laughHop(2.2), armL: [-0.6, 0.2], armR: [-0.6, 0.2], head: [-0.3, 0, 0], y: 0.0 });

    const hand = new THREE.Vector3(0.75, 1.95 - 0.8 * Math.cos(2.9 * lift), -0.8 * Math.sin(2.9 * lift) * -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.45);

  } else if (s === 5) {
    show(KID, { pos: [-2.2, 1.7], yaw: 0.25, ex: "shock", armL: [-0.3, 0.5], armR: [-0.3, 0.5] });
    show(MOM, { pos: [0.4, 1.9], yaw: -0.1, ex: "shock", armL: [-2.2, 0.6], armR: [-2.2, 0.6] });

let WORDS = [];
const COLOR = { grandpa: "#ffd23f", house: "#4fd8ff", day: "#7dff6a", laughed: "#ffd23f", sunrise: "#ffb347", block: "#4fd8ff", walls: "#7dff6a", roof: "#ff6b5a",
  mailbox: "#4fd8ff", nobody: "#ff5a5a", neighbors: "#7dff6a", yard: "#ff5a5a", front: "#ff5a5a" };

  render3D(t);
  octx.drawImage(renderer.domElement, 0, 0);
  drawCaption(t);

};
window.DUR = DUR;
Promise.all([document.fonts.load("700 86px Fredoka"), fetch("voice/words.json").then((r) => r.json())]).then(([, w]) => {
  WORDS = w; const q = new URLSearchParams(location.search); window.render(parseFloat(q.get("t") ?? "0")); document.title = "READY"; window.READY = true;
});
